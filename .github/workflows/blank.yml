name: Auto Create Pull Request on MLOPS

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Verificar mensaje de commit y crear PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Último mensaje de commit: $COMMIT_MSG"

          if echo "$COMMIT_MSG" | grep -iq "MLOPS"; then
            echo "Palabra clave 'MLOPS' encontrada. Creando Pull Request..."
            
            EXISTING_PR=$(gh pr list --head master --base main --state open --json number -q '.[0].number')
            
            if [ -z "$EXISTING_PR" ]; then
              gh pr create \
                --head master \
                --base main \
                --title "Automated PR: Integration from master to main [MLOPS]" \
                --body "## Automated Pull Request 🤖
                Este PR fue creado automáticamente desde la rama **master** hacia **main** al detectar la palabra clave \`MLOPS\` en el último commit."
            else
              echo "Ya existe un PR abierto (#$EXISTING_PR) desde master hacia main."
            fi
          else
            echo "El mensaje del commit no contiene 'MLOPS'. No se creará ningún PR."
          fi